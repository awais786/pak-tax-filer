[project]
name = "pak-tax-filer-backend"
version = "0.1.0"
description = "FastAPI backend for pak-tax-filer"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=3.0.0",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
]

# Ruff formats only; pylint lints (research R2: the lead's hook uses pylint).
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.main]
py-version = "3.13"

# SQLAlchemy 2's relationship() makes pylint misread every Mapped[...] annotation as
# "unsubscriptable" (a known astroid false positive). Strict mypy checks subscripts properly.
[tool.pylint."messages control"]
disable = ["unsubscriptable-object"]

# SQLAlchemy models and settings dataclasses are data holders with no methods by design.
[tool.pylint.design]
min-public-methods = 0

# Our migrations folder is also named alembic/; the library is third-party.
[tool.pylint.imports]
known-third-party = ["alembic"]

# Generated Alembic migrations repeat standard column definitions; report only longer copies.
[tool.pylint.similarities]
min-similarity-lines = 10

[tool.mypy]
python_version = "3.13"
strict = true

# reportlab (the eval's generator) and PyYAML (the tax worked examples), both dev-only, ship no
# type information.
[[tool.mypy.overrides]]
module = ["reportlab.*", "yaml", "weasyprint"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the `app` package from backend/ without installing it.
pythonpath = ["."]
