# The end-to-end test stack (e2e/README.md): docker-compose.yml plus a fake Gemini server, so the
# app's real AI clients answer from fixed synthetic data and no test reaches Google. Always run
# under its own project name, so it has its own database and never touches development data:
#   docker compose -p pak-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
# Its ports (18000, 15173) differ from development's, so both stacks can run at once.
services:
  fake-gemini:
    image: python:3.13-slim
    command: ["python", "/srv/server.py"]
    volumes:
      - ./e2e/fake_gemini:/srv:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    # Its own host port (replacing the development one), so it runs beside the dev stack.
    ports: !override
      - "18000:8000"
    environment:
      # The google-genai SDK sends every Gemini call here instead of Google.
      GOOGLE_GEMINI_BASE_URL: http://fake-gemini:8080
      # Not a key: the fake server ignores it; set so the app's AI features switch on.
      GEMINI_API_KEY: e2e-placeholder-not-a-real-key
      OTEL_EXPORTER: none
    depends_on:
      fake-gemini:
        condition: service_healthy

  frontend:
    ports: !override
      - "15173:5173"
