# Local development: `docker compose up -d` starts db, backend and frontend (README, feature 001).
# The database credentials below are local-development-only values, not secrets; no .env is needed.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pak_tax_filer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pak_tax_filer"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pak_tax_filer
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules (Linux builds) instead of the host's.
      - /app/node_modules

volumes:
  db-data:
