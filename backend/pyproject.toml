[project]
name = "pak-tax-filer-backend"
version = "0.1.0"
description = "FastAPI backend for pak-tax-filer"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# Ruff formats only; pylint lints (research R2: the lead's hook uses pylint).
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.main]
py-version = "3.13"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the `app` package from backend/ without installing it.
pythonpath = ["."]
