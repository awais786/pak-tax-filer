# Machine-checkable subset of health.md (feature 001), checked by
# scripts/validate_contracts.py against the app's OpenAPI schema. The Markdown
# stays the full contract; change both together (docs/contracts.md).
openapi: 3.1.0
info:
  title: Feature 001 contract
  version: 1.0.0
paths:
  /health:
    get:
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required:
                - status
