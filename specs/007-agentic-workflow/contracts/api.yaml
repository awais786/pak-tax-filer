# Machine-checkable subset of workflow-api.md (feature 007), checked by
# scripts/validate_contracts.py against the app's OpenAPI schema. The Markdown
# stays the full contract; change both together (docs/contracts.md).
openapi: 3.1.0
info:
  title: Feature 007 contract
  version: 1.0.0
paths:
  /api/workflow:
    get:
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required: &id001
                - step
                - tax_year
                - fingerprint
                - document
                - validation
                - research
                - gate
                - approved_at
                - done_at
  /api/workflow/start:
    post:
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required: *id001
  /api/workflow/approve:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fingerprint
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required: *id001
  /api/workflow/back:
    post:
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required: *id001
  /api/workflow/result:
    get:
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required:
                - tax_year
                - blocked_reason
                - salary_tax
                - surcharge
                - profit_tax
                - salary_balance
                - profit_balance
                - non_atl_extra_withheld
                - steps
                - summary
                - label
                - passages
  /api/workflow/done:
    post:
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required: *id001
