# Worked examples for the simple tax calculator (feature 010, tasks T002-T003; FR-012).
#
# Each example is worked by hand from the Income Tax Ordinance, 2001 as amended up to 31.07.2025
# (FBR; the copy pinned by SHA-256 in app/rag/sources.yaml), using the rules and pages in
# specs/010-income-tax-engine/research.md. They become the calculator's tests (T009, T015,
# T018), so they must be right BEFORE any calculator code exists.
#
# SIGN-OFF (T003): ACCEPTED PROVISIONALLY by Saifullah Khan on 2026-11-14. The examples were
# worked out by Claude from the Ordinance pages in research.md and their arithmetic
# cross-checked by an independent script; they were NOT checked by hand line by line. Saifullah
# chose to go ahead because a tax practitioner will review the app (Principle IV): every example
# and every rule they rest on must be revised then, and corrected here first if the practitioner
# disagrees. test_sign_off.py fails on any example without a signer and date.
#
# Rules used (research.md; p. = printed page, PDF p. = page in the file):
# - Yearly amounts: salary income = salary_monthly x 12 + bonus (bonus is salary, s.12(2)(a),
#   p. 48); rent = rent_monthly x 12.
# - Property income = rent - one-fifth of rent (repairs allowance, s.15A(1)(a), p. 57). Rent is
#   slab income: separate rates for individuals were omitted by FA2021 (R1).
# - Taxable income = salary income + property income. Dividends and bank profit are final taxes
#   kept out of it (s.8(1)(a), p. 44-45), so they never count in the 75% test or the 10m limit.
# - Table: salaried (clause (2), p. 491-492) when salary income EXCEEDS 75% of taxable income;
#   otherwise non-salaried (clause (1), p. 489-490). Exactly 75% is not "exceeds".
# - Upper limits "do not exceed"; the Rs 10,000,000 surcharge limit "exceeds" (s.4AB, p. 33):
#   9% of the slab tax with any salary income, 10% without.
# - Dividends 15% (s.5, Division III(b), p. 499); bank profit 20% (s.7B, Division IIIA(a),
#   p. 500); bank profit above 5,000,000 is refused (s.7B(3)(b)): profit_over_limit.
# - Rounding (s.219, p. 436): each of slab tax, surcharge, dividend tax and profit tax is
#   rounded to the rupee, 50 paisa or more up; total_tax = the sum of those rounded lines.
# - salary_share = salary income / taxable income x 100, to 2 places (half up); null without
#   taxable income. effective_rate = total_tax / (salary income + rent + dividends + bank profit)
#   x 100, to 1 place (half up); gross rent, before the allowance.
# - monthly (s.149, p. 308): tax on salary_monthly x 12 alone on the salaried table (+9% above
#   10m), / 12, rounded; take_home = salary_monthly - that. Null without a monthly salary.
# - bonus_impact = total_tax - total_tax with the bonus at 0; null unless salary and bonus > 0.
# - filer_comparison: deductions at source, not tax: dividends 15% filer / 30% not on the ATL
#   (Part III Division I(b), p. 519; Tenth Schedule rule 1, p. 761); bank profit 20% / 40%
#   (Part III Division IA(a), p. 521). "your" follows the profile's ATL status.
#
# Salaried rows: 1 <=600k: 0 | 2 <=1.2m: 1% over 600k | 3 <=2.2m: 6,000 + 11% over 1.2m |
#   4 <=3.2m: 116,000 + 23% over 2.2m | 5 <=4.1m: 346,000 + 30% over 3.2m | 6: 616,000 + 35%
#   over 4.1m.
# Non-salaried rows: 1 <=600k: 0 | 2 <=1.2m: 15% over 600k | 3 <=1.6m: 90,000 + 20% over 1.2m |
#   4 <=3.2m: 170,000 + 30% over 1.6m | 5 <=5.6m: 650,000 + 40% over 3.2m | 6: 1,610,000 + 45%
#   over 5.6m.
#
# Inputs not listed are "0"; atl is true unless listed. Expected fields not listed are: blocked
# null, surcharge/dividend_tax/profit_tax "0", bonus_impact null, filer_comparison [].
# The arithmetic was cross-checked with a calculator when the examples were written.

tax_year: "2025-26"

examples:
  # ---- The lead's example --------------------------------------------------------------------

  - id: lead-salary-and-rent
    description: Salary Rs 250,000 and rent Rs 140,000 a month (the lead's example).
    inputs: {salary_monthly: "250000", rent_monthly: "140000"}
    working:
      - "Salary income 250,000 x 12 = 3,000,000. Rent 140,000 x 12 = 1,680,000."
      - "Property income = 1,680,000 - 1,680,000 / 5 (336,000) = 1,344,000 (s.15A(1)(a))."
      - "Taxable income = 3,000,000 + 1,344,000 = 4,344,000."
      - "Salary share 3,000,000 / 4,344,000 = 69.06%: not more than 75%, non-salaried table."
      - "Non-salaried row 5: 650,000 + 40% x (4,344,000 - 3,200,000 = 1,144,000) = 1,107,600."
      - "Taxable income does not exceed 10,000,000: no surcharge. Total 1,107,600."
      - "Effective rate 1,107,600 / (3,000,000 + 1,680,000) = 23.67% -> 23.7."
      - "Monthly: 3,000,000 on the salaried table row 4 = 116,000 + 23% x 800,000 = 300,000;
        / 12 = 25,000; take-home 225,000."
    expected: {taxable_income: "4344000", salary_share: "69.06", table: non_salaried,
               slab_tax: "1107600", total_tax: "1107600", effective_rate: "23.7",
               monthly: {salary_tax: "25000", take_home: "225000"}}
    signed_off_by: "Saifullah Khan (provisional; to be revised at tax practitioner review)"
    signed_off_date: "2026-11-14"

