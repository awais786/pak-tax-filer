# Production: one small VM (docs/deployment.md). `docker compose -f docker-compose.prod.yml up -d`.
# Differs from docker-compose.yml (local development): no code mounts or live reload, the
# frontend is built once and served by Caddy with automatic HTTPS, and the database is not
# reachable from outside. Every secret comes from the server's own uncommitted .env:
# POSTGRES_PASSWORD, GEMINI_API_KEY and SITE_ADDRESS (the site's hostname, for the certificate);
# also UPLOAD_BUCKET, the private bucket for uploads (not a secret; empty keeps them on disk).
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pak_tax_filer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pak_tax_filer"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    # Continuous deployment pulls the images CI built for a commit (IMAGE_TAG, set by
    # deploy/deploy.sh); `up -d --build` on the VM still builds them here (the manual fallback).
    image: ${IMAGE_REPO:-ghcr.io/awais786}/pak-tax-filer-backend:${IMAGE_TAG:-local}
    build: ./backend
    restart: unless-stopped
    # Migrate, then serve; no --reload in production.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/pak_tax_filer
      # The session cookie is HTTPS-only (Caddy provides HTTPS).
      COOKIE_SECURE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The private Cloud Storage bucket for uploads (feature 003, FR-018), reached with the
      # VM's own Google identity, so no key. Empty keeps uploads on the disk volume below.
      UPLOAD_BUCKET: ${UPLOAD_BUCKET:-}
      # Telemetry spans go to these logs (feature 008); "none" turns them off.
      OTEL_EXPORTER: ${OTEL_EXPORTER:-console}
    # The logs are capped (3 files of 10 MB, the oldest dropped): with telemetry each request
    # writes its spans here, and Docker otherwise keeps every line on the VM's 30 GB disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Files uploaded before UPLOAD_BUCKET was set stay here and keep working.
      - uploads:/data/uploads

  web:
    image: ${IMAGE_REPO:-ghcr.io/awais786}/pak-tax-filer-web:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: ../deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The HTTPS certificate, kept across restarts (Let's Encrypt limits re-issuing).
      - caddy-data:/data

volumes:
  db-data:
  uploads:
  caddy-data:
